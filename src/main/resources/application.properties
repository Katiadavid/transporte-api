server.port=3333

spring.datasource.url=jdbc:mariadb://localhost:3306/transporte
# XAMPP: utilizador root, sem password (por defeito)
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# O esquema é criado por database/schema.sql — o Hibernate não mexe nele
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Usar os nomes de coluna exatamente como declarados (IdP, tipo_passageiro, ...)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false

spring.jackson.time-zone=Africa/Maputo